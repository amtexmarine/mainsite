<html lang="en">
<head>
  <meta charset="utf-8" />

  <style>
/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Quicksand', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #00d4ff 0%, #0099cc 25%, #0066aa 55%, #003d7a 80%, #001f4d 100%);
  background-attachment: fixed;
  -webkit-backface-visibility: hidden;
          backface-visibility: hidden;
}

/* ── KEYFRAMES ── */
@keyframes shimmer {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
@keyframes waveShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── SCROLL ANIMATION BASE STATES ── */
.anim-hidden {
  opacity: 0;
  transform: translate3d(0, 28px, 0);
  transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: opacity, transform;
}
.anim-hidden.scale {
  transform: scale3d(0.97, 0.97, 1) translate3d(0, 12px, 0);
}
.anim-hidden.visible {
  opacity: 1;
  transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
  will-change: auto;
}

.anim-hidden:nth-of-type(1) { transition-delay: 0s; }
.anim-hidden:nth-of-type(2) { transition-delay: 0.08s; }
.anim-hidden:nth-of-type(3) { transition-delay: 0.16s; }
.anim-hidden:nth-of-type(4) { transition-delay: 0.24s; }
.anim-hidden:nth-of-type(5) { transition-delay: 0.32s; }

/* ── VIDEO / HERO IMAGE SECTION ── */
.video-section {
  width: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  contain: layout style;
}
.video-section img {
  width: 100%;
  max-height: 80vh;
  object-fit: cover;
  display: block;
}

/* ── TEXT BAR ── */
.text-bar {
  width: 100%;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255, 255, 255, 0.25);
  border-bottom: 1px solid rgba(255, 255, 255, 0.25);
  padding: 28px 0;
  text-align: center;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
  position: relative;
  overflow: hidden;
  contain: layout style;
}
.text-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 60%; height: 100%;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,0.14) 50%,
    transparent 100%);
  animation: shimmer 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  pointer-events: none;
  will-change: transform;
}
.text-bar h1, .text-bar p {
  margin: 10px;
  line-height: 1.4;
  color: white;
}
.text-bar h1 { margin-bottom: 8px; }

/* ── HERO SLIDESHOW ── */
.hero {
  position: relative;
  width: 100%;
  height: 70vh;
  overflow: hidden;
  margin-top: 50px;
  margin-bottom: 50px;
  contain: layout style;
}

/* Each slide is absolutely stacked; translateX controls position */
.hero-slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  /* Default: parked off-screen to the right */
  transform: translateX(100%);
  /* Smooth slide transition */
  transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}

/* Active slide sits at center */
.hero-slide.active {
  transform: translateX(0%);
  z-index: 1;
}

/* Outgoing slide exits left */
.hero-slide.exit-left {
  transform: translateX(-100%);
  z-index: 1;
}

/* Incoming slide from the left (back-swipe) */
.hero-slide.enter-left {
  transform: translateX(-100%);
}

.hero-slide img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}

/* ── DOTS ── */
.hero .dots {
  position: absolute;
  bottom: 20px;
  width: fit-content;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
  background: rgba(0,0,0,0.25);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.hero .dot {
  display: inline-block;
  width: 12px; height: 12px;
  margin: 0 6px;
  background-color: rgba(255,255,255,0.5);
  border-radius: 50%;
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.2s ease;
}
.hero .dot:hover  { transform: scale(1.3); }
.hero .dot.active { background-color: rgba(255,255,255,1); }

/* ── BUTTON SECTION ── */
.btn-section {
  padding: 40px 20px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.25);
  border-bottom: 1px solid rgba(255,255,255,0.25);
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  background-size: 300% 300%;
  animation: waveShift 8s ease infinite;
  background-image: linear-gradient(135deg,
    rgba(255,255,255,0.18) 0%,
    rgba(255,255,255,0.08) 50%,
    rgba(255,255,255,0.18) 100%);
  contain: layout style;
}

/* ── BUTTONS ── */
.button-center {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 0;
}
.btn-large {
  padding: 16px 40px;
  font-size: 1.1rem;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border-radius: 40px;
  text-decoration: none;
  display: inline-block;
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow 0.25s ease,
              background 0.25s ease,
              color 0.25s ease,
              border-color 0.25s ease;
  will-change: transform;
}
.btn-white {
  background: rgba(255,255,255,0.7);
  color: black;
  border: 2px solid rgba(255,255,255,0.6);
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.btn-white:hover {
  background: rgba(255,255,255,0.2);
  color: white;
  border-color: white;
  transform: translateY(-4px);
  box-shadow: 0 10px 28px rgba(0,0,0,0.2);
}
.btn-black {
  background: #001f4d;
  color: white;
  border: 2px solid #001f4d;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.btn-black:hover {
  background: transparent;
  color: white;
  border-color: white;
  transform: translateY(-4px);
  box-shadow: 0 10px 28px rgba(0,0,0,0.2);
}

/* ── BOTTOM TEXT SECTION ── */
.bottom-section {
  padding: 60px 20px;
  max-width: 900px;
  margin: auto;
  text-align: center;
}

/* ── MOBILE ── */
@media (max-width: 768px) {
  /* Remove the <br><br> visual effect — handled by padding instead */
  body > br { display: none; }

  .video-section img {
    max-height: 55vw;
  }

  .text-bar {
    padding: 24px 16px;
  }
  .text-bar h1 {
    font-size: 28px !important;
    margin: 6px;
  }
  .text-bar p {
    font-size: 17px !important;
    margin: 4px;
  }

  .hero {
    height: 56vw;
    min-height: 220px;
    max-height: 420px;
    margin-top: 44px;
    margin-bottom: 44px;
    padding: 0;
  }

  .hero .dots {
    bottom: 10px;
  }

  .btn-section {
    padding: 36px 16px;
  }
  .button-center {
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .btn-large {
    width: 80%;
    text-align: center;
    padding: 14px 24px;
  }

  .bottom-section {
    padding: 48px 20px;
  }
  .bottom-section h2 {
    font-size: 24px !important;
  }
  .bottom-section p {
    font-size: 17px !important;
  }
}
  </style>
</head>

<body>

<header class="site-header" id="siteHeader">

<script>
/* ─────────────────────────────────────────────────────────
   SLIDESHOW — cinematic push + scale + fade
   Outgoing: shrinks slightly, fades, exits in swipe direction
   Incoming: enters from opposite side, expands into place
   ───────────────────────────────────────────────────────── */
const slides     = document.querySelectorAll('.hero-slide');
const dots       = document.querySelectorAll('.dot');
let currentIndex = 0;
let animating    = false;
const SLIDE_DUR  = 400;

const heroEl = document.getElementById('heroSlider');
const lazySlideObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      document.querySelectorAll('.hero-slide img[data-src]').forEach(img => {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      });
      lazySlideObserver.unobserve(entry.target);
    }
  });
}, { rootMargin: '200px' });
if (heroEl) lazySlideObserver.observe(heroEl);

function setStyle(el, props) {
  Object.assign(el.style, props);
}

slides.forEach((s, i) => {
  setStyle(s, {
    position:   'absolute',
    top:        '0',
    left:       '0',
    width:      '100%',
    height:     '100%',
    opacity:    i === 0 ? '1' : '0',
    transform:  i === 0 ? 'translateX(0%) scale(1)' : 'translateX(100%) scale(1)',
    transition: 'none',
    zIndex:     i === 0 ? '1' : '0',
    willChange: 'transform, opacity',
  });
});

function showSlide(nextIndex, direction = 'forward') {
  if (animating || nextIndex === currentIndex) return;
  animating = true;

  const out = slides[currentIndex];
  const inc = slides[nextIndex];

  const outExit  = direction === 'forward' ? 'translateX(-18%) scale(0.92)' : 'translateX(18%) scale(0.92)';
  const incStart = direction === 'forward' ? 'translateX(100%) scale(1.04)'  : 'translateX(-100%) scale(1.04)';

  const easing = `${SLIDE_DUR}ms cubic-bezier(0.76, 0, 0.24, 1)`;

  setStyle(inc, { transition: 'none', transform: incStart, opacity: '0', zIndex: '2' });
  setStyle(out, { zIndex: '1' });

  void inc.offsetWidth;

  setStyle(out, {
    transition: `transform ${easing}, opacity ${easing}`,
    transform:  outExit,
    opacity:    '0',
  });
  setStyle(inc, {
    transition: `transform ${easing}, opacity ${easing}`,
    transform:  'translateX(0%) scale(1)',
    opacity:    '1',
  });

  dots.forEach((d, i) => d.classList.toggle('active', i === nextIndex));

  setTimeout(() => {
    setStyle(out, { transition: 'none', transform: 'translateX(100%) scale(1)', opacity: '0', zIndex: '0' });
    setStyle(inc, { zIndex: '1', willChange: 'auto' });
    currentIndex = nextIndex;
    animating    = false;
  }, SLIDE_DUR + 40);
}

let autoplayInterval = setInterval(
  () => showSlide((currentIndex + 1) % slides.length, 'forward'),
  2500
);

dots.forEach(dot => {
  dot.addEventListener('click', () => {
    const next = Number(dot.dataset.index);
    const dir  = next > currentIndex ? 'forward' : 'backward';
    clearInterval(autoplayInterval);
    showSlide(next, dir);
    autoplayInterval = setInterval(
      () => showSlide((currentIndex + 1) % slides.length, 'forward'),
      2500
    );
  });
});

let startX = 0, startY = 0, startTime = 0;
if (heroEl) {
  heroEl.addEventListener('touchstart', e => {
    startX    = e.touches[0].clientX;
    startY    = e.touches[0].clientY;
    startTime = Date.now();
  }, { passive: true });

  heroEl.addEventListener('touchend', e => {
    const dx      = startX - e.changedTouches[0].clientX;
    const dy      = startY - e.changedTouches[0].clientY;
    const elapsed = Date.now() - startTime;
    if (Math.abs(dy) > Math.abs(dx)) return;
    const isSwipe = Math.abs(dx) > 40 || (elapsed < 200 && Math.abs(dx) > 15);
    if (!isSwipe) return;

    clearInterval(autoplayInterval);
    showSlide(
      dx > 0
        ? (currentIndex + 1) % slides.length
        : (currentIndex - 1 + slides.length) % slides.length,
      dx > 0 ? 'forward' : 'backward'
    );
    autoplayInterval = setInterval(
      () => showSlide((currentIndex + 1) % slides.length, 'forward'),
      2500
    );
  }, { passive: true });
}

const animElements = document.querySelectorAll('.anim-hidden');
const scrollObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      scrollObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -20px 0px' });
animElements.forEach(el => scrollObserver.observe(el));

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(autoplayInterval);
  } else {
    autoplayInterval = setInterval(
      () => showSlide((currentIndex + 1) % slides.length, 'forward'),
      2500
    );
  }
});
</script>
