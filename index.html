/* ── RESET & BASE ── */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'Quicksand', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #00d4ff 0%, #0099cc 25%, #0066aa 55%, #003d7a 80%, #001f4d 100%);
  background-attachment: fixed;
  -webkit-backface-visibility: hidden;
          backface-visibility: hidden;
}

/* ── KEYFRAMES ── */
@keyframes shimmer {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
@keyframes waveShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes ripplePulse {
  0%, 100% { transform: translate(-50%,-50%) scale(1);   opacity: 0.18; }
  50%       { transform: translate(-50%,-50%) scale(1.5); opacity: 0.06; }
}
@keyframes floatUp {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-7px); }
}

/* ── SCROLL ANIMATION BASE STATES ── */
.anim-hidden {
  opacity: 0;
  transform: translate3d(0, 28px, 0);
  transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
              transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: opacity, transform;
}
.anim-hidden.scale {
  transform: scale3d(0.97, 0.97, 1) translate3d(0, 12px, 0);
}
.anim-hidden.visible {
  opacity: 1;
  transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
  will-change: auto;
}
.anim-hidden:nth-of-type(1) { transition-delay: 0s; }
.anim-hidden:nth-of-type(2) { transition-delay: 0.08s; }
.anim-hidden:nth-of-type(3) { transition-delay: 0.16s; }
.anim-hidden:nth-of-type(4) { transition-delay: 0.24s; }
.anim-hidden:nth-of-type(5) { transition-delay: 0.32s; }

/* ── HERO IMAGE SECTION ── */
.video-section {
  width: 100%;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  contain: layout style;
  position: relative;
}
.video-section img {
  width: 100%;
  max-height: 80vh;
  object-fit: cover;
  display: block;
}
.video-section::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 140px;
  background: linear-gradient(to bottom, transparent, rgba(0,55,110,0.6));
  pointer-events: none;
}

/* ── TEXT BAR ── */
.text-bar {
  width: 100%;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255, 255, 255, 0.25);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding: 36px 0 32px;
  text-align: center;
  box-shadow: 0 4px 40px rgba(0, 0, 0, 0.18);
  position: relative;
  overflow: hidden;
  contain: layout style;
}
.text-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.12) 50%, transparent 100%);
  animation: shimmer 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  pointer-events: none;
  will-change: transform;
}
.text-bar h1, .text-bar p {
  margin: 10px;
  line-height: 1.4;
  color: white;
  position: relative;
  z-index: 1;
}
.text-bar h1 { margin-bottom: 8px; }

/* ── WAVE DIVIDER ── */
.wave-divider {
  width: 100%;
  overflow: hidden;
  line-height: 0;
  margin: 0;
  display: block;
}
.wave-divider svg {
  display: block;
  width: 100%;
  height: 56px;
}

/* ── SERVICE STRIP ── */
.service-strip {
  width: 100%;
  padding: 8px 24px 16px;
}
.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  max-width: 860px;
  margin: 0 auto;
}
.service-card {
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 20px;
  padding: 32px 20px 28px;
  text-align: center;
  color: white;
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
              background 0.3s ease,
              box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
}
.service-card::before {
  content: '';
  position: absolute;
  top: -50px; left: 50%;
  transform: translateX(-50%);
  width: 140px; height: 140px;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.service-card:hover {
  transform: translateY(-6px);
  background: rgba(255, 255, 255, 0.17);
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24);
}
.service-icon {
  width: 50px;
  height: 50px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: floatUp 4s ease-in-out infinite;
}
.service-icon svg {
  width: 100%;
  height: 100%;
  fill: none;
  stroke: rgba(255,255,255,0.88);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.service-card:nth-child(2) .service-icon { animation-delay: 0.6s; }
.service-card:nth-child(3) .service-icon { animation-delay: 1.2s; }
.service-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  margin: 0 0 5px;
}
.service-title {
  font-size: 17px;
  font-weight: 700;
  color: white;
  margin: 0;
}

/* ── HERO SLIDESHOW ── */
.hero {
  position: relative;
  width: 100%;
  height: 70vh;
  overflow: hidden;
  margin-top: 50px;
  margin-bottom: 0;
  contain: layout style;
}
.hero-slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform: translateX(100%);
  transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}
.hero-slide.active   { transform: translateX(0%);    z-index: 1; }
.hero-slide.exit-left { transform: translateX(-100%); z-index: 1; }
.hero-slide.enter-left { transform: translateX(-100%); }
.hero-slide img {
  width: 100%; height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 100px;
  background: linear-gradient(to bottom, transparent, rgba(0,40,100,0.45));
  pointer-events: none;
  z-index: 2;
}

/* ── DOTS ── */
.hero .dots {
  position: absolute;
  bottom: 20px;
  width: fit-content;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
  background: rgba(0,0,0,0.28);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.hero .dot {
  display: inline-block;
  width: 12px; height: 12px;
  margin: 0 6px;
  background-color: rgba(255,255,255,0.5);
  border-radius: 50%;
  cursor: pointer;
  transition: background-color 0.3s ease, transform 0.2s ease;
}
.hero .dot:hover  { transform: scale(1.3); }
.hero .dot.active { background-color: rgba(255,255,255,1); }

/* ── WAVE BETWEEN SLIDER AND BUTTONS ── */
.wave-mid {
  width: 100%;
  overflow: hidden;
  line-height: 0;
  margin: 0;
  display: block;
  position: relative;
  z-index: 3;
}
.wave-mid svg {
  display: block;
  width: 100%;
  height: 48px;
}

/* ── BUTTON SECTION ── */
.btn-section {
  padding: 48px 20px 54px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 4px 40px rgba(0,0,0,0.18);
  background-size: 300% 300%;
  animation: waveShift 8s ease infinite;
  background-image: linear-gradient(135deg,
    rgba(255,255,255,0.15) 0%,
    rgba(255,255,255,0.05) 50%,
    rgba(255,255,255,0.15) 100%);
  contain: layout style;
  text-align: center;
}
.btn-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  margin: 0 0 16px;
}
.section-rule {
  width: 50px;
  height: 2px;
  background: rgba(255,255,255,0.3);
  margin: 0 auto 28px;
  border-radius: 2px;
}

/* ── BUTTONS ── */
.button-center {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 0;
}
.btn-large {
  padding: 16px 44px;
  font-size: 1.05rem;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border-radius: 40px;
  text-decoration: none;
  display: inline-block;
  transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
              box-shadow 0.25s ease,
              background 0.25s ease,
              color 0.25s ease,
              border-color 0.25s ease;
  will-change: transform;
}
.btn-white {
  background: rgba(255,255,255,0.75);
  color: #001f4d;
  border: 2px solid rgba(255,255,255,0.6);
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
}
.btn-white:hover {
  background: rgba(255,255,255,0.15);
  color: white;
  border-color: white;
  transform: translateY(-4px);
  box-shadow: 0 14px 32px rgba(0,0,0,0.22);
}
.btn-black {
  background: #001f4d;
  color: white;
  border: 2px solid rgba(255,255,255,0.3);
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
}
.btn-black:hover {
  background: transparent;
  color: white;
  border-color: white;
  transform: translateY(-4px);
  box-shadow: 0 14px 32px rgba(0,0,0,0.22);
}

/* ── CONTACT SECTION ── */
.bottom-section {
  padding: 68px 20px 80px;
  max-width: 900px;
  margin: auto;
  text-align: center;
  position: relative;
}
.ripple-ring {
  position: absolute;
  top: 50%; left: 50%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
  pointer-events: none;
  animation: ripplePulse 6s ease-in-out infinite;
}
.ripple-ring-1 { width: 420px; height: 420px; animation-delay: 0s; }
.ripple-ring-2 { width: 260px; height: 260px; animation-delay: 1.2s; }

.contact-heading {
  font-weight: 300;
  font-size: 28px;
  margin: 0 0 8px;
  color: white;
  position: relative;
  z-index: 1;
}
.contact-rule {
  width: 40px;
  height: 2px;
  background: rgba(255,255,255,0.3);
  margin: 0 auto 26px;
  border-radius: 2px;
  position: relative;
  z-index: 1;
}
.contact-phone {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 40px;
  padding: 14px 34px;
  text-decoration: none;
  color: white;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.5px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background 0.25s ease,
              transform 0.25s cubic-bezier(0.22,1,0.36,1),
              box-shadow 0.25s ease;
  position: relative;
  z-index: 1;
}
.contact-phone:hover {
  background: rgba(255,255,255,0.2);
  transform: translateY(-3px);
  box-shadow: 0 14px 34px rgba(0,0,0,0.22);
}
.contact-phone svg {
  width: 19px; height: 19px;
  stroke: white; fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.contact-location {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-top: 20px;
  position: relative;
  z-index: 1;
}

/* ── MOBILE ── */
@media (max-width: 768px) {
  body > br { display: none; }
  .video-section img { max-height: 55vw; }
  .text-bar { padding: 24px 16px; }
  .text-bar h1 { font-size: 28px !important; margin: 6px; }
  .text-bar p  { font-size: 17px !important; margin: 4px; }

  .wave-divider svg { height: 36px; }
  .wave-mid svg     { height: 32px; }

  .service-strip { padding: 4px 12px 12px; }
  .service-grid  { gap: 10px; }
  .service-card  { padding: 22px 10px 18px; border-radius: 16px; }
  .service-icon  { width: 38px; height: 38px; margin-bottom: 10px; }
  .service-title { font-size: 13px; }
  .service-label { font-size: 9px; letter-spacing: 1.5px; }

  .hero {
    height: 56vw;
    min-height: 220px;
    max-height: 420px;
    margin-top: 44px;
  }
  .hero .dots { bottom: 10px; }

  .btn-section { padding: 36px 16px 42px; }
  .button-center { flex-direction: column; align-items: center; gap: 14px; }
  .btn-large { width: 80%; text-align: center; padding: 14px 24px; }

  .bottom-section { padding: 52px 20px 64px; }
  .contact-heading { font-size: 22px !important; }
  .contact-phone   { font-size: 17px; padding: 12px 26px; }
  .ripple-ring-1   { width: 280px; height: 280px; }
  .ripple-ring-2   { width: 170px; height: 170px; }
}
  </style>
</head>

<script>
/* ── SLIDESHOW ── */
const slides     = document.querySelectorAll('.hero-slide');
const dots       = document.querySelectorAll('.dot');
let currentIndex = 0;
let animating    = false;
const SLIDE_DUR  = 400;

const heroEl = document.getElementById('heroSlider');
const lazySlideObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      document.querySelectorAll('.hero-slide img[data-src]').forEach(img => {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      });
      lazySlideObserver.unobserve(entry.target);
    }
  });
}, { rootMargin: '200px' });
if (heroEl) lazySlideObserver.observe(heroEl);

function setStyle(el, props) { Object.assign(el.style, props); }

slides.forEach((s, i) => {
  setStyle(s, {
    position: 'absolute', top: '0', left: '0', width: '100%', height: '100%',
    opacity:    i === 0 ? '1' : '0',
    transform:  i === 0 ? 'translateX(0%) scale(1)' : 'translateX(100%) scale(1)',
    transition: 'none',
    zIndex:     i === 0 ? '1' : '0',
    willChange: 'transform, opacity',
  });
});

function showSlide(nextIndex, direction = 'forward') {
  if (animating || nextIndex === currentIndex) return;
  animating = true;
  const out = slides[currentIndex];
  const inc = slides[nextIndex];
  const outExit  = direction === 'forward' ? 'translateX(-18%) scale(0.92)' : 'translateX(18%) scale(0.92)';
  const incStart = direction === 'forward' ? 'translateX(100%) scale(1.04)'  : 'translateX(-100%) scale(1.04)';
  const easing   = `${SLIDE_DUR}ms cubic-bezier(0.76, 0, 0.24, 1)`;

  setStyle(inc, { transition: 'none', transform: incStart, opacity: '0', zIndex: '2' });
  setStyle(out, { zIndex: '1' });
  void inc.offsetWidth;
  setStyle(out, { transition: `transform ${easing}, opacity ${easing}`, transform: outExit, opacity: '0' });
  setStyle(inc, { transition: `transform ${easing}, opacity ${easing}`, transform: 'translateX(0%) scale(1)', opacity: '1' });

  dots.forEach((d, i) => {
    d.classList.toggle('active', i === nextIndex);
    d.setAttribute('aria-selected', i === nextIndex ? 'true' : 'false');
  });

  setTimeout(() => {
    setStyle(out, { transition: 'none', transform: 'translateX(100%) scale(1)', opacity: '0', zIndex: '0' });
    setStyle(inc, { zIndex: '1', willChange: 'auto' });
    currentIndex = nextIndex;
    animating    = false;
  }, SLIDE_DUR + 40);
}

let autoplayInterval = setInterval(
  () => showSlide((currentIndex + 1) % slides.length, 'forward'), 2500
);

dots.forEach(dot => {
  dot.addEventListener('click', () => {
    const next = Number(dot.dataset.index);
    const dir  = next > currentIndex ? 'forward' : 'backward';
    clearInterval(autoplayInterval);
    showSlide(next, dir);
    autoplayInterval = setInterval(
      () => showSlide((currentIndex + 1) % slides.length, 'forward'), 2500
    );
  });
});

let startX = 0, startY = 0, startTime = 0;
if (heroEl) {
  heroEl.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; startTime = Date.now();
  }, { passive: true });
  heroEl.addEventListener('touchend', e => {
    const dx      = startX - e.changedTouches[0].clientX;
    const dy      = startY - e.changedTouches[0].clientY;
    const elapsed = Date.now() - startTime;
    if (Math.abs(dy) > Math.abs(dx)) return;
    const isSwipe = Math.abs(dx) > 40 || (elapsed < 200 && Math.abs(dx) > 15);
    if (!isSwipe) return;
    clearInterval(autoplayInterval);
    showSlide(
      dx > 0 ? (currentIndex + 1) % slides.length : (currentIndex - 1 + slides.length) % slides.length,
      dx > 0 ? 'forward' : 'backward'
    );
    autoplayInterval = setInterval(
      () => showSlide((currentIndex + 1) % slides.length, 'forward'), 2500
    );
  }, { passive: true });
}

/* ── SCROLL ANIMATIONS ── */
const animElements = document.querySelectorAll('.anim-hidden');
const scrollObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      scrollObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12, rootMargin: '0px 0px -20px 0px' });
animElements.forEach(el => scrollObserver.observe(el));

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(autoplayInterval);
  } else {
    autoplayInterval = setInterval(
      () => showSlide((currentIndex + 1) % slides.length, 'forward'), 2500
    );
  }
});
</script>
